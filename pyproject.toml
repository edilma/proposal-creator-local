[project]
name = "proposal-creator"
version = "0.1.0"
description = "Local assistant that reads government solicitations and tells a small business whether it can bid."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
proposal-creator = "proposal_creator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proposal_creator"]
